<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Kickers Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding-top: 100px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }
        .status {
            background: rgba(255,255,255,0.1);
            padding: 15px 30px;
            border-radius: 8px;
            display: inline-block;
        }
        .api-links {
            margin-top: 40px;
        }
        .api-links a {
            color: #00d4ff;
            margin: 0 15px;
            text-decoration: none;
        }
        .api-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦸 Crime Kickers Hub</h1>
        <p>The backend is running. API endpoints are available below:</p>
        <div class="status">✅ Server Online</div>
        <div class="api-links">
            <a href="/api/heroes">/api/heroes</a>
            <a href="/api/entities">/api/entities</a>
            <a href="/api/comics">/api/comics</a>
            <a href="/api/stories">/api/stories</a>
            <a href="/admin">Admin Login</a>
        </div>
    </div>
</body>
</html>

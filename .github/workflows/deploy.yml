# Crime Kickers Hub - CI/CD Pipeline
# ===================================

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image digest
        run: |
          echo "Image built: ${{ steps.meta.outputs.tags }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Portainer via SSH
        uses: appleboy/ssh-action@v1
        id: deploy
        with:
          host: ${{ secrets.PORTAINER_HOST }}
          username: ${{ secrets.PORTAINER_USERNAME }}
          key: ${{ secrets.PORTAINER_SSH_KEY }}
          script: |
            # Pull the latest image and restart the stack
            docker pull ghcr.io/iv/crimekickershub:latest
            cd /opt/portainer/stacks/crimekickershub
            docker compose pull
            docker compose up -d

      - name: Wait for deployment
        run: sleep 10

      - name: Verify deployment
        run: |
          # Check if container is running
          if docker ps | grep -q crimekickershub; then
            echo "Container is running"
            # Check container health
            docker inspect --format='{{.State.Health.Status}}' crimekickershub 2>/dev/null || echo "Health check not available"
          else
            echo "Container is not running"
            docker logs crimekickershub --tail 50
            exit 1
          fi

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          format: markdown
          message: |
            *Crime Kickers Hub Deployment*
            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            URL: https://crimekickershub.example.com

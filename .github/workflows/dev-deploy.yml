name: Build and Deploy Dev

on:
  push:
    branches-ignore:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value={{branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deploy-dev branch with docker-compose.dev.yml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Checkout or create deploy-dev branch
          git fetch origin master:deploy-dev 2>/dev/null || git checkout -b deploy-dev
          git checkout deploy-dev

          # Reset deploy-dev to match current branch (except for docker-compose.dev.yml)
          git reset --hard origin/${{ github.ref_name }}

          # Update docker-compose.dev.yml with the new SHA tag
          sed -i "s|ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:.*|ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}|g" docker-compose.dev.yml

          # Commit and push changes
          git add docker-compose.dev.yml .env.example.dev
          git commit -m "Dev Deploy: Update dev stack for branch ${{ github.ref_name }}" 2>/dev/null || echo "No changes to commit"
          git push origin deploy-dev --force

      - name: Summary
        run: |
          echo "## Dev Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ghcr.io/${{ github.repository }}:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy Branch**: deploy-dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To deploy:" >> $GITHUB_STEP_SUMMARY
          echo "1. Set up a Portainer stack using docker-compose.dev.yml from the deploy-dev branch" >> $GITHUB_STEP_SUMMARY
          echo "2. Or manually pull and run the image" >> $GITHUB_STEP_SUMMARY
          echo "3. Configure environment variables using .env.example.dev as a template" >> $GITHUB_STEP_SUMMARY

      - name: Trigger Portainer Webhook
        if: success()
        run: |
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_DEV }}" || echo "Webhook trigger failed (webhook may not be configured yet)"

name: Build and Deploy Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deploy branch with new image tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Checkout deploy branch
          git fetch origin deploy:deploy || git checkout -b deploy
          git checkout deploy

          # Reset deploy to match dev exactly (except for image tag)
          git reset --hard origin/dev

          # Update docker-compose.dev.yml with the new SHA tag
          sed -i "s|ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:.*|ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}|g" docker-compose.dev.yml

          # Commit and push changes
          git add docker-compose.dev.yml
          git commit -m "Dev Deploy: Update image to ${{ github.sha }}" || echo "No changes to commit"
          git push origin deploy --force

      - name: Trigger Dev Portainer Webhook
        if: success()
        run: |
          curl -X POST "${{ secrets.PORTAINER_REDEPLOY_HOOK_DEV }}" || echo "Dev webhook trigger failed (webhook may not be configured yet)"

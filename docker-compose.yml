version: "3.8"

services:
  crimekickershub:
    # The image tag will be replaced by GitHub Actions workflow in the deploy branch
    image: ghcr.io/korjavin/crimekickershub:latest
    container_name: crimekickershub
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crimekickershub.rule=Host(`${HOSTNAME}`)"
      - "traefik.http.routers.crimekickershub.entrypoints=websecure"
      - "traefik.http.routers.crimekickershub.tls.certresolver=myresolver"
      - "traefik.http.services.crimekickershub.loadbalancer.server.port=8080"
      # Increase timeouts for file uploads
      - "traefik.http.services.crimekickershub.loadbalancer.responseforwardingtimeouts.dialtimeout=120s"
      - "traefik.http.services.crimekickershub.loadbalancer.responseforwardingtimeouts.responseheadertimeout=120s"
      - "traefik.http.middlewares.crimekickershub-timeout.buffering.maxRequestBodyBytes=52428800"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      # Google OAuth Configuration
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - COOKIE_SECRET=${COOKIE_SECRET}

      # Cloudflare R2 Configuration
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN}

      # Application Configuration
      - DB_PATH=${DB_PATH:-/app/data/crimekickers.db}
      - SERVER_ADDR=${SERVER_ADDR:-:8080}
      - FRONTEND_PATH=${FRONTEND_PATH:-frontend/dist}

networks:
  traefik_network:
    name: ${NETWORK_NAME:-traefik_network}
    external: true

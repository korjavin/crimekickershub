version: "3.8"

services:
  crimekickershub:
    # The image tag will be replaced by GitHub Actions workflow in the deploy branch
    image: ghcr.io/korjavin/crimekickershub:34af704472dff181cd41875685d3f5588b68ef20
    container_name: crimekickershub
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crimekickershub.rule=Host(`${HOSTNAME}`)"
      - "traefik.http.routers.crimekickershub.entrypoints=websecure"
      - "traefik.http.routers.crimekickershub.tls.certresolver=myresolver"
      - "traefik.http.services.crimekickershub.loadbalancer.server.port=8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      # Google OAuth Configuration
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - COOKIE_SECRET=${COOKIE_SECRET}

      # Cloudflare R2 Configuration
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN}

      # Application Configuration
      - DB_PATH=${DB_PATH:-/app/data/crimekickers.db}
      - SERVER_ADDR=${SERVER_ADDR:-:8080}
      - FRONTEND_PATH=${FRONTEND_PATH:-frontend/dist}

  # Litestream - SQLite replication to Cloudflare R2
  # Use the vendored image: the official litestream/litestream:latest moved to a
  # shell-less (distroless) base, which breaks the `entrypoint: /bin/sh` inline-config
  # pattern below ("crun: /bin/sh not found"). This vendored tag ships litestream
  # v0.5.9 on an alpine base (has /bin/sh) and is backward-compatible with the
  # 0.3.x config format generated here.
  litestream:
    image: ghcr.io/korjavin/litestream:0.3.13
    container_name: crimekickershub-litestream
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat << EOF > /tmp/litestream.yml
        dbs:
          - path: ${DB_PATH:-/app/data/crimekickers.db}
            replicas:
              - type: s3
                bucket: ${LITESTREAM_R2_BUCKET_NAME}
                path: crimekickershub
                endpoint: https://${LITESTREAM_R2_ACCOUNT_ID}.r2.cloudflarestorage.com
                sync-interval: 1h
                snapshot-interval: 24h
                retention: 168h
        EOF
        exec litestream replicate -config /tmp/litestream.yml
    volumes:
      - ./data:/app/data
    depends_on:
      - crimekickershub
    environment:
      # AWS SDK reads these standard env vars (works for R2)
      - AWS_ACCESS_KEY_ID=${LITESTREAM_R2_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${LITESTREAM_R2_SECRET_ACCESS_KEY}
      - LITESTREAM_R2_ACCOUNT_ID=${LITESTREAM_R2_ACCOUNT_ID}
      - LITESTREAM_R2_BUCKET_NAME=${LITESTREAM_R2_BUCKET_NAME}

networks:
  traefik_network:
    name: ${NETWORK_NAME:-traefik_network}
    external: true
